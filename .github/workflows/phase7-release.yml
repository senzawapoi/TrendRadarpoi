name: Phase 7 release candidate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Immutable release identifier"
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: phase7-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.10'
      - name: Validate this exact revision before packaging
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock pytest ruff
          python -m pip check
          python -m ruff check trendradar/core/locking.py trendradar/core/heartbeat.py trendradar/ops scripts/deploy tests/deployment tests/integrations/feishu
          python -B -m pytest tests -q -p no:cacheprovider
          python -B -m compileall -q trendradar mcp_server scripts/deploy
      - name: Build release candidate
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -eu
          release_id="${REQUESTED_RELEASE_ID:-${GITHUB_REF_NAME}-${GITHUB_SHA}}"
          case "$release_id" in
            (*[!A-Za-z0-9._-]*|'')
              echo "release_id must contain only letters, numbers, dot, underscore, or hyphen" >&2
              exit 2
              ;;
          esac
          python -B scripts/deploy/build_release.py --output-dir dist --release-id "$release_id"
          artifact="dist/trendradar-${release_id}.tar.gz"
          python -B scripts/deploy/create_manifest.py --artifact "$artifact" --output dist/RELEASE-MANIFEST.json --release-id "$release_id"
      - name: Publish candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trendradar-release-candidate-${{ github.run_id }}
          path: |
            dist/*.tar.gz
            dist/RELEASE-MANIFEST.json
            scripts/deploy/install_release.sh
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trendradar-release-candidate-${{ github.run_id }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
