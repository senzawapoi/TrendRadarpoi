# Install as /etc/systemd/system/trendradar-scheduler.timer.d/50-every-5-min.conf.
# The empty assignment resets every base expression, including OnBootSec=, so
# OnActiveSec= must re-arm each timer start; 300s keeps the delivery tick period.
[Timer]
OnUnitActiveSec=
OnActiveSec=30s
OnUnitActiveSec=300s
AccuracySec=1s
