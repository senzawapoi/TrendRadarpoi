# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
# ═══════════════════════════════════════════════════════════════


# ===============================================================
# 1. 基础设置
# ===============================================================
lark:
  enabled: false
  identity_fields: {} # open_id/user_id/union_id -> list; empty denies everyone
  allowed_chat_types: [p2p, group]
  bot_id: "" # Bot open_id for explicit group mention matching
  reconnect_attempts: 5
  cooldown_seconds: 300
  event_lease_seconds: 120
  delivery_retry_base_seconds: 5
  delivery_retry_max_seconds: 300
  request_timeout_seconds: 30
  max_message_chars: 8000
  delivery_max_stories: 20
  delivery_max_batches_per_tick: 3 # bounded catch-up per scheduler run (1 = one batch)
  delivery:
    enabled: false
    target: "" # chat_id; may be supplied by LARK_DELIVERY_TARGET
    mode: instant
    # Reader-interest filter for instant pushes. Held-back Stories stay in the database,
    # reports and Assistant search. Omitted lists use the broad built-in defaults in
    # trendradar/integrations/feishu/story_filter.py; a configured list replaces them.
    filter:
      enabled: true # LARK_DELIVERY_FILTER_ENABLED may override
      # domains: [ai, security]
      # sources: ["rss:TechCrunch AI", "rss:Hugging Face Blog"]
      # exclude_sources: ["newsnow:jin10"]
      # keywords: [AI, 人工智能, 芯片]

app:
  # 时区配置（影响所有时间显示、推送窗口判断、数据存储）
  # 常用时区：
  #   - Asia/Shanghai (北京时间 UTC+8)
  #   - America/New_York (美东时间 UTC-5/-4)
  #   - Europe/London (伦敦时间 UTC+0/+1)
  # 完整时区列表: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Asia/Shanghai"
  show_version_update: true           # 显示版本更新提示


# ===============================================================
# 2. 数据源 - 热榜平台
#
# id: 平台唯一标识（勿修改）
# name: 显示名称（可自定义，修改后不影响运行）
# ===============================================================
platforms:
  #- id: "wallstreetcn-hot"
   # name: "华尔街见闻"
  #- id: "thepaper"
   # name: "澎湃新闻"
  #- id: "bilibili-hot-search"
   # name: "bilibili 热搜"
  #- id: "cls-hot"
   # name: "财联社热门"
  #- id: "ifeng"
   # name: "凤凰网"
  #- id: "tieba"
   # name: "贴吧"
  #- id: "weibo"
   # name: "微博"
  #- id: "zhihu"
   # name: "知乎"
  - id: "jin10"
    name: "金十数据"
  - id: "github"
    name: "GitHub"
  - id: "ithome"
    name: "IT之家"
  - id: "fastbull-express"
    name: "法布财经 快讯"


# ===============================================================
# 3. 数据源 - RSS 订阅
#
# 与热榜数据分开存储，按时间流展示
# 每个源配置：id(唯一标识)、name(显示名称)、url(订阅地址)
# enabled: 可选，默认 true
# max_age_days: 可选，覆盖全局 freshness_filter.max_age_days
# ===============================================================
rss:
  enabled: true                       # 是否启用 RSS 抓取

  # 文章新鲜度过滤配置（全局默认值）
  # 过滤掉发布时间超过指定天数的旧文章，避免同一篇文章重复出现在推送中
  #
  # 过滤逻辑：
  #   - 文章发布时间距当前时间（app.timezone 时区）超过 N 天则不推送
  #   - 无发布时间的文章会被保留（不过滤）
  #
  # ⚠️ 过滤时机：在推送阶段过滤
  #    - 所有文章都会存入数据库（MCP Server 的 AI 查询仍可访问）
  #    - 只有新鲜的文章会被推送到通知渠道
  freshness_filter:
    enabled: true                     # 是否启用新鲜度过滤（默认启用）
    max_age_days: 3                   # 最大文章年龄（天）
                                      # - 正整数：只推送 N 天内的文章
                                      # - 0：禁用过滤，推送所有文章

  # 单个 feed 可配置 max_age_days 覆盖全局设置：
  # - 不配置：使用全局 freshness_filter.max_age_days（默认 3 天）
  # - 正整数：覆盖全局设置，只推送此天数内的文章
  # - 0：禁用此频道的新鲜度过滤，推送所有文章
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
      # max_age_days: 1               # 示例：只推送1天内的文章
    
    - id: "yahoo-finance"
      name: "雅虎财经"
      url: "https://finance.yahoo.com/news/"
      format: "yahoo_news"
      enabled: true
    
    -  id: "cnn_world"
       name: "CNN世界新闻"
       url: "http://rss.cnn.com/rss/cnn_world.rss"
       enabled: true
       max_age_days: 1
    
    -  id: "cnn_politics"
       name: "CNN政治"
       url: "http://rss.cnn.com/rss/cnn_allpolitics.rss"
       #当掉了这个url
       enabled: false
       max_age_days: 1

    -  id: "bbc_news"
       name: "BBC新闻"
       url: "https://feeds.bbci.co.uk/news/rss.xml"
       enabled: true
       max_age_days: 1

    -  id: "chaonengwang"
       name: "超能网"
       url: "https://www.expreview.com/rss.php"
       enabled: true
       max_age_days: 1

    -  id: "The_Guardian_World"
       name: "G_WORLD"
       url: "https://feedmaker.kindle4rss.com/feeds/world.theguardian.xml"
       enabled: true
       max_age_days: 1

    -  id: "DIGITIMES_科技"
       name: "台湾电子时报_科技"
       url: "https://www.digitimes.com.tw/tech/rss/xml/xmlrss_10_0.xml"
       enabled: true
       max_age_days: 1  

    -  id: "DIGITIMES_研究"
       name: "台湾电子时报_研究"
       url: "https://www.digitimes.com.tw/tech/rss/xml/xmlrss_30_0.xml"
       enabled: true
       max_age_days: 1

    -  id: "DIGITIMES_区域"
       name: "台湾电子时报_区域"
       url: "https://www.digitimes.com.tw/tech/rss/xml/xmlrss_90_0.xml"
       enabled: true
       max_age_days: 1
    
    -  id: "Nvdia"
       name: "NVIDIA Blog"
       url: "https://nvidianews.nvidia.com/releases.xml"
       enabled: true
       max_age_days: 1
     
    -  id: "HPCwire"
       name: "HPCwire"
       url: "https://feeds.feedburner.com/hpcwire"
       enabled: true
       max_age_days: 1

    -  id: "Ars Technica"
       name: "ArsTechnica"
       url: "https://feeds.arstechnica.com/arstechnica/index"
       enabled: true
       max_age_days: 1

    -  id: "EE Times"
       name: "EETimes"
       url: "https://www.eetimes.com/feed/"
