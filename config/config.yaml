# Core Gemini service. GEMINI_API_KEY is environment-only.
ai:
  gemini:
    enabled: true
    models: [gemini-3.8-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite]
    model_cooldown_seconds: 60
    timeout_seconds: 30
    max_attempts: 3
    retry_backoff_seconds: 1
    min_request_interval_seconds: 1
    max_input_chars: 32000
    max_output_chars: 12000


# ===============================================================
# 4. 统一情报数据层（旧 SQLite 与报告保持兼容；Story 交由 Lark 投递）
# ===============================================================
intelligence:
  enabled: true
  database_path: "output/intelligence.db"
  require_existing: false
  sqlite_synchronous: "FULL"
  health:
    require_source_runs: false
    require_backup: false
    heartbeat_max_age_seconds: 60
    source_max_age_hours: 6
    queue_wait_seconds: 300
    backup_max_age_hours: 26
    backup_dir: "output/backups"
    expected_roles: []
    expected_sources: []
  story:
    enabled: true
    output_dir: "output/stories"
    timezone: "Asia/Shanghai"
    wording:
      enabled: false
    clustering:
      time_window_hours: 24
      token_jaccard_threshold: 0.35
      title_similarity_threshold: 0.70
      min_shared_tokens: 2
      entity_keywords: {}
    ranking:
      weights:
        diversity: 0.25
        reliability: 0.20
        activity: 0.20
        recency: 0.20
        interest: 0.15
      source_reliability: {}
      user_interests: []
      recency_half_life_hours: 24
    report:
      enabled: true
      max_stories: 100
  assistant:
    enabled: true
    session_ttl_days: 30
    max_messages: 100
    max_history_messages: 12
    max_context_chars: 24000
    max_input_chars: 8000
    max_output_chars: 12000
    default_lookback_days: 7
    max_stories: 20
    max_members_per_story: 8
    max_observations_per_story: 16
    max_items: 20
    max_citations: 12
    max_tool_calls: 3
    max_tool_result_chars: 4000
    # 读者画像：Assistant 据此筛选与排序（≤2000 字，可用 INTELLIGENCE_ASSISTANT_READER_PROFILE 覆盖）
    reader_profile: >-
      主要关注 AI 相关的软件与硬件，涵盖技术、经济和政治三个层面：模型与开源发布、AI 开发工具与应用、
      芯片与算力基础设施、AI 公司融资与商业动态、AI 政策监管与出口管制。非 AI 内容仅在影响重大时提及。
    tools:
      search_stories: true
      search_content_items: true
      get_story_evidence: true
  research:
    enabled: false
    capabilities:
      - search_web
      - search_github
      - search_reddit
      - read_webpage
      - get_video_transcript
    timeout_seconds: 15
    max_results: 5
    max_result_chars: 3000
    max_response_bytes: 262144
    max_concurrency: 2
  security:
    enabled: true
    timezone: "Asia/Shanghai"
    output_dir: "output/security"
    max_concurrency: 4
    stale_after_hours: 48
    sources:
      cisa_kev:
        enabled: true
        timeout: 30
        max_items: 500
      nvd:
        enabled: true
        timeout: 30
        lookback_hours: 48
        date_field: published # published = new CVEs only; modified also re-reports old CVEs
        results_per_page: 2000
        max_pages: 2
        max_items: 200 # cap after the significance filter
        request_interval_seconds: 6
        # Keep only significant CVEs at collection time. Omitted rules use the built-in
        # ai_stack (CVSS >= 8.0) and major_platform (CVSS >= 9.0) keyword rules in
        # trendradar/sources/security.py; CISA KEV is collected separately.
        significance:
          enabled: true
          keep_known_exploited: true
          max_per_keyword: 3 # vendors batch-publish many CVEs per product; keep top scores
          # rules:
          #   - name: ai_stack
          #     min_cvss: 8.0
          #     keywords: [LangChain, Ollama, vLLM, PyTorch]
      rss:
        enabled: true
        timeout: 20
        max_age_days: 7
        feeds:
          - id: "cisa-advisories"
            name: "CISA Cybersecurity Advisories"
            url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
            max_items: 50
    ranking:
      weights:
        base: 0.15
        severity: 0.35
        known_exploited: 0.30
        action: 0.20
    report:
      enabled: true
      lookback_days: 30
      max_candidates: 500
      max_stories: 100


# ===============================================================
# 5. 报告模式
#
# 🔸 daily（当日汇总模式）
#    • 推送时机：按时推送(默认每小时推送一次)
#    • 显示内容：当日所有匹配新闻 + 新增新闻区域
#    • 适用场景：日报总结、全面了解当日热点趋势
#
# 🔸 current（当前榜单模式）
#    • 推送时机：按时推送(默认每小时推送一次)
#    • 显示内容：当前榜单匹配新闻 + 新增新闻区域
#    • 适用场景：实时热点追踪、了解当前最火的内容
#
# 🔸 incremental（增量监控模式）
#    • 推送时机：有新增才推送
#    • 显示内容：新出现的匹配频率词新闻
#    • 适用场景：避免重复信息干扰
# ===============================================================
report:
  mode: "incremental"                     # 可选: daily | current | incremental
  display_mode: "platform"             # 可选: keyword | platform
                                      # keyword: 按关键词分组显示（默认）
                                      # platform: 按平台/来源分组显示
  rank_threshold: 5                   # 排名高亮阈值
  sort_by_position_first: false       # true=按配置位置排序，false=按热点条数排序
  max_news_per_keyword: 0             # 每个关键词最大显示数量（0=不限制）
  reverse_content_order: false        # false=热点词汇统计在前，true=新增热点新闻在前




# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  # 存储后端选择
  # - auto: 自动选择（GitHub Actions 且配置了远程存储 → remote，否则 → local）
  # - local: 本地 SQLite + TXT/HTML 文件
  # - remote: 远程云存储（S3 兼容协议，支持 R2/OSS/COS 等）
  backend: "auto"

  # 数据格式选项
  formats:
    sqlite: true                      # 主存储（必须启用）
    txt: false                        # 是否生成 TXT 快照
    html: true                       # 是否生成 HTML 报告

  # 本地存储配置
  local:
    data_dir: "output"                # 数据目录
    retention_days: 0                 # 保留天数（0=永久保留）

  # 远程存储配置（S3 兼容协议）
  # 支持: Cloudflare R2, 阿里云 OSS, 腾讯云 COS, AWS S3, MinIO 等
  # 建议将敏感信息配置在 GitHub Secrets 或环境变量中
  remote:
    retention_days: 0                 # 保留天数（0=永久保留）
    # S3 兼容配置（或使用环境变量 S3_ENDPOINT_URL 等）
    endpoint_url: ""                  # 服务端点
                                      # Cloudflare R2: https://<account_id>.r2.cloudflarestorage.com
                                      # 阿里云 OSS: https://oss-cn-hangzhou.aliyuncs.com
                                      # 腾讯云 COS: https://cos.ap-guangzhou.myqcloud.com
    bucket_name: ""                   # 存储桶名称
    access_key_id: ""                 # 访问密钥 ID
    secret_access_key: ""             # 访问密钥
    region: ""                        # 区域（可选，部分服务商需要）

  # 数据拉取配置（从远程同步到本地）
  # 用于 MCP Server 等场景：爬虫存到远程，MCP 拉取到本地分析
  pull:
    enabled: false                    # 是否启用启动时自动拉取
    days: 7                           # 拉取最近 N 天的数据


# ===============================================================
# 8. 高级设置（一般无需修改）
# ===============================================================
advanced:
  # # 版本检查

  # 爬虫设置
  crawler:
    enabled: true                     # 是否启用爬取新闻功能
    request_interval: 1000            # 请求间隔（毫秒）
    use_proxy: false                  # 是否启用代理
    default_proxy: "http://127.0.0.1:10801"

  # RSS 设置
  rss:
    request_interval: 2000            # 请求间隔（毫秒）
    timeout: 15                       # 请求超时（秒）
    use_proxy: false                  # 是否使用代理
    proxy_url: ""                     # RSS 专属代理（留空则使用 crawler.default_proxy）

  # 排序权重（用于重新排序不同平台的热搜）
  # 合起来等于 1
  weight:
    rank: 0.6                         # 排名权重
    frequency: 0.3                    # 频次权重
    hotness: 0.1                      # 热度权重



# ===============================================================
# 9. AI 前沿资讯聚合（独立子系统）
#
# 独立聚合 ArXiv/Reddit/HackerNews/GitHub Trending/X/Podcast/Blog 七类源
# 入口：python -m trendradar.ai_frontier
# 独立数据库：output/ai_frontier.db
# 生产由 VPS timer 每 2 小时运行；Actions 仅手动诊断
#
# 环境变量（直接复用主系统已有 Secrets，无需额外配置）：
#   GEMINI_API_KEY  —— 与 crawler.yml 共用
# ===============================================================
ai_frontier:
  enabled: true                       # 总开关

  # 只保留最近 N 小时内发布的条目（0=禁用过滤）
  freshness_hours: 24

  # 是否翻译英文标题为中文（需 GEMINI_API_KEY）
  translate: true

  # 推送配置
  push:
    # 各源最低分数阈值（过低的条目不推送）
    min_score_hackernews: 50          # HN points 阈值
    min_score_reddit: 30              # Reddit upvote 阈值
    min_stars_github: 100             # GitHub Trending 本期 stars 阈值
    min_score_podcast: 0              # Podcast 默认不过滤
    min_score_blog: 0                 # 官方博客默认不过滤

    # 单次推送最多条数（防刷屏）
    max_items_per_push: 30

  # 数据源配置
  sources:
    # ArXiv 论文（免 Key）
    arxiv:
      enabled: true
      categories: ["cs.AI", "cs.LG", "cs.CL"]   # 分类，参考 https://arxiv.org/category_taxonomy
      max_results: 30

    # Reddit 公开 API（免 Key）
    # 覆盖：学术研究 / 开源模型 / 公司动态 / AI 应用
    reddit:
      # Temporarily suspended by owner on 2026-10-29; restore required-source checks with access.
      enabled: false
      subreddits:
        - "MachineLearning"    # 学术研究 & 论文讨论
        - "LocalLLaMA"         # 开源模型部署（Llama/Qwen/DeepSeek 等）
        - "singularity"        # AGI / 重大事件讨论
        - "OpenAI"             # OpenAI 新品发布
        - "ClaudeAI"           # Anthropic Claude
        - "StableDiffusion"    # 图像生成
        - "ChatGPT"            # ChatGPT 应用与讨论
        - "artificial"         # 泛 AI 新闻
        - "LLMDevs"            # LLM 开发者
        - "AI_Agents"          # AI Agent 生态
      limit_per_sub: 25
      min_score: 30

    # HackerNews Algolia Search（免 Key）
    # 每个关键词是一次独立搜索，关键词越多抓取时间越长
    hackernews:
      enabled: true
      keywords:
        # === 通用 AI 关键词 ===
        - "AI"
        - "LLM"
        - "AGI"
        # === 主流公司 & 产品（新公司创立 / 融资 / 收购） ===
        - "OpenAI"
        - "Anthropic"
        - "xAI"
        - "Mistral"
        - "DeepSeek"
        - "Perplexity"
        - "Moonshot"            # Moonshot AI（Kimi 背后的公司）
        # === 主流模型（新技术上新） ===
        - "GPT"
        - "Claude"
        - "Gemini"
        - "Llama"
        - "Sora"
        - "Kimi"                # Kimi K1/K2 系列模型
        - "Qwen"                # 通义千问
        - "GLM"                 # 智谱 GLM 系列
        # === 热门技术方向（重大事件） ===
        - "AI agent"
        - "multimodal"
        - "RAG"
      min_score: 50

    # GitHub Trending（HTML 解析）
    github_trending:
      enabled: true
      languages: ["python", "unknown"]          # unknown = All languages
      since: "daily"                            # daily | weekly | monthly
      min_stars: 100

    # YouTube 播客（来自 follow-builders 默认信息源；通过官方 RSS 抓取）
    youtube_podcast:
      enabled: true
      feeds:
        - name: "Latent Space"
