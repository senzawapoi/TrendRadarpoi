# ===============================================================
# 4. 报告模式
#
# 🔸 daily（当日汇总模式）
#    • 推送时机：按时推送(默认每小时推送一次)
#    • 显示内容：当日所有匹配新闻 + 新增新闻区域
#    • 适用场景：日报总结、全面了解当日热点趋势
#
# 🔸 current（当前榜单模式）
#    • 推送时机：按时推送(默认每小时推送一次)
#    • 显示内容：当前榜单匹配新闻 + 新增新闻区域
#    • 适用场景：实时热点追踪、了解当前最火的内容
#
# 🔸 incremental（增量监控模式）
#    • 推送时机：有新增才推送
#    • 显示内容：新出现的匹配频率词新闻
#    • 适用场景：避免重复信息干扰
# ===============================================================
report:
  mode: "incremental"                     # 可选: daily | current | incremental
  display_mode: "platform"             # 可选: keyword | platform
                                      # keyword: 按关键词分组显示（默认）
                                      # platform: 按平台/来源分组显示
  rank_threshold: 5                   # 排名高亮阈值
  sort_by_position_first: false       # true=按配置位置排序，false=按热点条数排序
  max_news_per_keyword: 0             # 每个关键词最大显示数量（0=不限制）
  reverse_content_order: false        # false=热点词汇统计在前，true=新增热点新闻在前


# ===============================================================
# 5. 推送通知
#
# ⚠️ 重要安全警告 ⚠️
#
# 🔴 请务必妥善保管好 webhooks，不要公开!!!
# 🔴 如果你以 fork 的方式部署在 GitHub 上，请勿在此填写
# 🔴 而是将 webhooks 填入 GitHub Secrets
#    (Settings → Secrets and variables → Actions)
# 🔴 否则：
#    - 轻则：手机上收到大量垃圾广告推送
#    - 重则：webhook 被滥用造成严重安全隐患
#
# 📌 多账号支持说明
#
# • 使用分号(;)分隔多个账号，如："url1;url2;url3"
# • 需要配对的配置（如 Telegram 的 token 和 chat_id）数量必须一致
# • 每个渠道最多支持 max_accounts_per_channel 个账号
# • 邮箱已支持多收件人（逗号分隔）
# ===============================================================
notification:
  enabled: true                       # 是否启用通知功能

  # 🕐 推送时间窗口控制（可选功能）
  # 用途：限制推送的时间范围，避免非工作时间打扰
  # 适用场景：
  #   - 只想在工作日白天接收推送（如 09:00-18:00）
  #   - 希望在晚上固定时间收到汇总（如 20:00-22:00）
  # 注意：GitHub Actions 执行时间不稳定，时间范围建议至少留足 2 小时
  #       如果想要精准的定时推送，建议使用 Docker 部署在个人服务器上
  push_window:
    enabled: true                    # 是否启用推送时间窗口控制
    start: "0:00"                    # 开始时间（北京时间）
    end: "23:59"                      # 结束时间（北京时间）
    once_per_day: false                # true=窗口内只推送一次，false=窗口内每次执行都推送

  # 推送渠道配置
  channels:
    feishu:
      webhook_url: ""                 # 飞书机器人 webhook URL

    dingtalk:
      webhook_url: ""                 # 钉钉机器人 webhook URL

    wework:
      webhook_url: ""                 # 企业微信机器人 webhook URL
      msg_type: "markdown"            # 消息类型：markdown(群机器人) | text(个人微信应用)

    telegram:
      bot_token: ""                   # Telegram Bot Token
      chat_id: ""                     # Telegram Chat ID

    email:
      from: ""                        # 发件人邮箱地址
      password: ""                    # 发件人邮箱密码或授权码
      to: ""                          # 收件人邮箱，多个用逗号分隔
      smtp_server: ""                 # SMTP 服务器（可选，留空自动识别）
      smtp_port: ""                   # SMTP 端口（可选，留空自动识别）

    ntfy:
      server_url: "https://ntfy.sh"   # ntfy 服务器地址（可改为自托管）
      topic: ""                       # ntfy 主题名称
      token: ""                       # ntfy 访问令牌（可选，用于私有主题）

    bark:
      url: "https://api.day.app/AocxghzJ2Thdd3VP9Mpd7n/"                         # Bark 推送 URL（格式：https://api.day.app/your_device_key）

    slack:
      webhook_url: ""                 # Slack Incoming Webhook URL


# ===============================================================
# 6. 存储配置
# ===============================================================
storage:
  # 存储后端选择
  # - auto: 自动选择（GitHub Actions 且配置了远程存储 → remote，否则 → local）
  # - local: 本地 SQLite + TXT/HTML 文件
  # - remote: 远程云存储（S3 兼容协议，支持 R2/OSS/COS 等）
  backend: "auto"

  # 数据格式选项
  formats:
    sqlite: true                      # 主存储（必须启用）
    txt: false                        # 是否生成 TXT 快照
    html: true                       # 是否生成 HTML 报告（⚠️ 邮件推送必须设为 true）

  # 本地存储配置
  local:
    data_dir: "output"                # 数据目录
    retention_days: 0                 # 保留天数（0=永久保留）

  # 远程存储配置（S3 兼容协议）
  # 支持: Cloudflare R2, 阿里云 OSS, 腾讯云 COS, AWS S3, MinIO 等
  # 建议将敏感信息配置在 GitHub Secrets 或环境变量中
  remote:
    retention_days: 0                 # 保留天数（0=永久保留）
    # S3 兼容配置（或使用环境变量 S3_ENDPOINT_URL 等）
    endpoint_url: ""                  # 服务端点
                                      # Cloudflare R2: https://<account_id>.r2.cloudflarestorage.com
                                      # 阿里云 OSS: https://oss-cn-hangzhou.aliyuncs.com
                                      # 腾讯云 COS: https://cos.ap-guangzhou.myqcloud.com
    bucket_name: ""                   # 存储桶名称
    access_key_id: ""                 # 访问密钥 ID
    secret_access_key: ""             # 访问密钥
    region: ""                        # 区域（可选，部分服务商需要）

  # 数据拉取配置（从远程同步到本地）
  # 用于 MCP Server 等场景：爬虫存到远程，MCP 拉取到本地分析
  pull:
    enabled: false                    # 是否启用启动时自动拉取
    days: 7                           # 拉取最近 N 天的数据


# ===============================================================
# 7. 高级设置（一般无需修改）
# ===============================================================
advanced:
  # # 版本检查

  # 爬虫设置
  crawler:
    enabled: true                     # 是否启用爬取新闻功能
    request_interval: 1000            # 请求间隔（毫秒）
    use_proxy: false                  # 是否启用代理
    default_proxy: "http://127.0.0.1:10801"

  # RSS 设置
  rss:
    request_interval: 2000            # 请求间隔（毫秒）
    timeout: 15                       # 请求超时（秒）
    use_proxy: false                  # 是否使用代理
    proxy_url: ""                     # RSS 专属代理（留空则使用 crawler.default_proxy）
    notification_enabled: true        # 是否启用 RSS 通知推送

  # 排序权重（用于重新排序不同平台的热搜）
  # 合起来等于 1
  weight:
    rank: 0.6                         # 排名权重
    frequency: 0.3                    # 频次权重
    hotness: 0.1                      # 热度权重

  # 多账号限制
  max_accounts_per_channel: 3         # 每个渠道最大账号数量

  # 消息分批大小（字节）- 内部配置，请勿修改
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3              # 批次发送间隔（秒）
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"


# ===============================================================
# 8. AI 前沿资讯聚合（独立子系统）
#
# 独立聚合 ArXiv/Reddit/HackerNews/GitHub Trending/X(Nitter) 五大源
# 入口：python -m trendradar.ai_frontier
# 独立数据库：output/ai_frontier.db
# 独立 Actions：.github/workflows/ai-frontier.yml（每 2 小时）
#
# 环境变量（直接复用主系统已有 Secrets，无需额外配置）：
#   GEMINI_API_KEY  —— 与 crawler.yml 共用
#   BARK_URL        —— 与 crawler.yml 共用；未设置时回退 notification.channels.bark.url
# ===============================================================
ai_frontier:
  enabled: true                       # 总开关

  # 只保留最近 N 小时内发布的条目（0=禁用过滤）
  freshness_hours: 24

  # 是否翻译英文标题为中文（需 GEMINI_API_KEY）
  translate: true

  # 推送配置
  push:
    # AI 前沿专用 Bark URL（留空则回退到 notification.channels.bark.url）
    # 建议在 GitHub Secrets 中配置 BARK_URL，不要写在这里
    bark_url: ""

    # 各源最低分数阈值（过低的条目不推送）
    min_score_hackernews: 50          # HN points 阈值
    min_score_reddit: 30              # Reddit upvote 阈值
    min_stars_github: 100             # GitHub Trending 本期 stars 阈值

    # 单次推送最多条数（防刷屏）
    max_items_per_push: 30

  # 数据源配置
  sources:
    # ArXiv 论文（免 Key）
    arxiv:
      enabled: true
      categories: ["cs.AI", "cs.LG", "cs.CL"]   # 分类，参考 https://arxiv.org/category_taxonomy
      max_results: 30

    # Reddit 公开 API（免 Key）
    # 覆盖：学术研究 / 开源模型 / 公司动态 / AI 应用
    reddit:
      enabled: true
      subreddits:
        - "MachineLearning"    # 学术研究 & 论文讨论
        - "LocalLLaMA"         # 开源模型部署（Llama/Qwen/DeepSeek 等）
        - "singularity"        # AGI / 重大事件讨论
        - "OpenAI"             # OpenAI 新品发布
        - "ClaudeAI"           # Anthropic Claude
        - "StableDiffusion"    # 图像生成
        - "ChatGPT"            # ChatGPT 应用与讨论
        - "artificial"         # 泛 AI 新闻
        - "LLMDevs"            # LLM 开发者
        - "AI_Agents"          # AI Agent 生态
      limit_per_sub: 25
      min_score: 30

    # HackerNews Algolia Search（免 Key）
    # 每个关键词是一次独立搜索，关键词越多抓取时间越长
    hackernews:
      enabled: true
      keywords:
        # === 通用 AI 关键词 ===
        - "AI"
        - "LLM"
        - "AGI"
        # === 主流公司 & 产品（新公司创立 / 融资 / 收购） ===
        - "OpenAI"
        - "Anthropic"
        - "xAI"
        - "Mistral"
        - "DeepSeek"
        - "Perplexity"
        - "Moonshot"            # Moonshot AI（Kimi 背后的公司）
        # === 主流模型（新技术上新） ===
        - "GPT"
        - "Claude"
        - "Gemini"
        - "Llama"
        - "Sora"
        - "Kimi"                # Kimi K1/K2 系列模型
        - "Qwen"                # 通义千问
        - "GLM"                 # 智谱 GLM 系列
        # === 热门技术方向（重大事件） ===
        - "AI agent"
        - "multimodal"
        - "RAG"
      min_score: 50

    # GitHub Trending（HTML 解析）
    github_trending:
      enabled: true
      languages: ["python", "unknown"]          # unknown = All languages
      since: "daily"                            # daily | weekly | monthly
      min_stars: 100

    # X / Twitter 账号（通过 Nitter 镜像 RSS）
    # 涵盖：顶级 AI 实验室 / 创业公司 / 关键研究者 / 行业领袖
    # 最佳实践：账号越多覆盖越全，但会增加抓取时间；按需注释掉不关心的账号
    x_nitter:
      enabled: true
      accounts:
        # ===== 顶级 AI 实验室 & 公司官方账号（新模型/新产品发布第一手来源）=====
        - "openai"              # OpenAI
        - "anthropicai"         # Anthropic
        - "googledeepmind"      # Google DeepMind
        - "aiatmeta"            # Meta AI
        - "xai"                 # xAI（Elon Musk 新公司）
        - "mistralai"           # Mistral AI
        - "cohere"              # Cohere
        - "perplexity_ai"       # Perplexity
        - "deepseek_ai"         # DeepSeek
        - "alibaba_qwen"        # 通义千问 Qwen
        - "kimi_moonshot"       # Moonshot Kimi
        - "zhipuai"             # 智谱 AI / GLM
        - "stabilityai"         # Stability AI
        - "huggingface"         # HuggingFace

        # ===== AI 应用 & 创业公司（新产品 / 新公司动态）=====
        - "cursor_ai"           # Cursor 编程助手
        - "v0"                  # Vercel v0
        - "groqinc"             # Groq 推理芯片
        - "togethercompute"     # Together AI
        - "fireworksai_hq"      # Fireworks AI
        - "liquidai_"           # Liquid AI
        - "character_ai"        # Character.AI
